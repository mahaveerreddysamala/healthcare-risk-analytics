name: Healthcare ML CI

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile src/model.py src/eda.py src/download_data.py src/model_comparison.py src/evaluate.py app.py
      - run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml
      - run: python -m src.eda
      - run: python -m src.model_comparison
      - run: python -m src.evaluate
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-evaluation-reports
          path: |
            reports/
            coverage.xml
          if-no-files-found: warn
